<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/304058e96a.js" crossorigin="anonymous"></script>
    <title>Template</title>
</head>
<body>
    <div class="top-nav centerX space-between">
        <div>
            <img src="graphic.svg" style="border:none; width:80px; height:80px;">
        </div>
        <div width="100%">
            <i class="fa-solid fa-bell cut"  ></i>
            <i><span class="fa-solid fa-circle-user"></span>Sign in</i>
            
        </div>

    </div>
    
    <nav class="side-nav rounded-right-only">
        <main class="space-evenly col">
            <div class="centerY">
                <p>Data</p>
            </div>
        </main>
        <button class="border-gradient-round rounded-right-only center">
            <i class="fa-solid fa-bars" aria-disabled="false"></i>
            <i class="fa-solid fa-x" aria-disabled="true"></i>
        </button>
        
        
    </nav>
    <main style="margin-top: 90px">
        <div>
            <h2>Slider example</h2>
            <input type="checkbox" id="toggle" class="toggle-checkbox">
            <label for="toggle" class="toggle-label">
                <span class="toggle-inner-button"></span>
            </label>
        </div>

        <div class="centerX">
            <div class="test border-gradient-round">
                I have a rounded colored border
            </div>
        </div>
    </main>
    
</body>
<script>
    /*toggle code */
    const toggle = document.getElementById("toggle")
    toggle.addEventListener("change", (e)=>{
        if (e.target && e.target.checked)console.log("toggle checked / turned on")
    })

    // side nav code 
    const side_nav = document.querySelector(".side-nav")
    const side_button = document.querySelector(".side-nav button")
    const bars_icon = document.querySelector(".side-nav button .fa-bars")
    const close_icon = document.querySelector(".side-nav button .fa-x")

    side_button.addEventListener("click", () => {
        const isVisible = side_nav.classList.toggle("is-visible")
        bars_icon.ariaDisabled = isVisible ? "true" : "false"
        close_icon.ariaDisabled = isVisible ? "false" : "true"
    })

    const search = document.querySelector(".search")
    const search_button = document.getElementById("search-load")

    search_button.addEventListener("click", () => {
        search.classList.toggle("is-open")
    })

    //  mega link config
    const b = document.querySelector(".toggle-header")
    const open = document.querySelector(".top-nav .burger")
    const close = document.querySelector(".top-nav .mega-close")
    const nav = document.querySelector(".top-nav .double-header-mega")
    b.addEventListener("click", () => {
        const isVisible = nav.classList.toggle("is-visible")
        open.ariaDisabled = isVisible ? "true" : "false"
        close.ariaDisabled = isVisible ? "false" : "true"
    })

    const mobileScreen = window.matchMedia("(max-width: 500px)")
    mobileScreen.addEventListener("change", (event) => {
        if (!event.matches) {
            nav.classList.remove("is-visible")
            open.ariaDisabled = "false"
            close.ariaDisabled = "true"
        }
    })


</script>
</html>
